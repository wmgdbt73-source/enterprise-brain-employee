/* ===== V0.13 · Work Runtime / Navigation / Readability ===== */
:root{--bg:#ffffff}
.main,.workspace,.content{background:#fff!important}
.workspace{background-image:none!important}
.composerWrap{background:linear-gradient(180deg,rgba(255,255,255,0),#fff 34%)!important}
.tools,.rail{background:#fff!important}
.content{padding-top:18px}

/* Project tabs remain visible and stable inside sub-pages */
.tabs{position:relative;z-index:35;background:#fff!important;flex:0 0 44px}
.tabs button.active{box-shadow:inset 0 -2px 0 #6d5dfc;color:#1f2024}

/* Unified Back + Breadcrumb */
.subNav,.breadcrumb,.contextBreadcrumb{
  min-height:30px;display:flex;align-items:center;gap:6px;
  margin:0 0 14px;font-size:9px;color:#858a92
}
.subNav .breadcrumbBack,.breadcrumb .breadcrumbBack,.contextBreadcrumb .breadcrumbBack{
  width:27px;height:27px;flex:0 0 27px;display:grid;place-items:center;
  border:1px solid #dedfdd!important;background:#fff!important;border-radius:8px!important;
  padding:0!important;color:#34373d!important;font-size:13px!important;line-height:1;
  margin-right:2px
}
.subNav .breadcrumbBack:hover,.breadcrumb .breadcrumbBack:hover,.contextBreadcrumb .breadcrumbBack:hover{
  border-color:#bdbfc4!important;background:#f7f7f8!important;color:#5f50da!important;text-decoration:none!important
}
.subNav button:not(.breadcrumbBack),.breadcrumb button:not(.breadcrumbBack),.contextBreadcrumb button:not(.breadcrumbBack){
  border:0;background:transparent;padding:3px 1px;color:#666b72;font-size:9px
}
.subNav button:not(.breadcrumbBack):hover,.breadcrumb button:not(.breadcrumbBack):hover,.contextBreadcrumb button:not(.breadcrumbBack):hover{
  color:#5b4fd0;text-decoration:underline
}
.subNav .current,.breadcrumb .current,.contextBreadcrumb .current{color:#282b30;font-weight:650}

/* Codex-like Add menu */
.plusMenu.workAddMenu{width:310px;padding:8px;border-radius:13px}
.addMenuTitle{padding:5px 8px 7px;color:#999da4;font-size:8px;text-transform:uppercase;letter-spacing:.06em}

.addMenuItem .addIcon{width:22px;height:22px;border-radius:7px;background:#f1f1f4;display:grid;place-items:center;color:#5d5f67;font-size:10px}
.addMenuItem span b{display:block;font-size:9px;color:#30343a}
.addMenuItem span small{display:block;font-size:7px;color:#969aa1;margin-top:2px;line-height:1.35}
.addMenuItem.activeMode{background:#f6f4ff!important}
.addMenuItem.activeMode .addIcon{background:#ebe7ff;color:#6353dc}
.workspaceChip{

  background:#f2efff;color:#6354ce;font-size:7px
}

.noticeDrawer{

.noticeListItem p{color:#7d8289!important}
.noticeListItem.unread{background:#f8f6ff!important}
.noticeListItem.unread::before{background:#765ff3!important}

/* Keep page hierarchy readable */
.groupConversation,.contextConversation,.page{background:#fff}
.activityList,.card,.groupChatEntry,.dmPanel,.contextIntro,.workThread{box-shadow:none}

.groupMessageBody{max-width:72%;min-width:0}
.groupMessage.me .groupMessageBody{display:flex;flex-direction:column;align-items:flex-end}
.groupMessageMeta{display:flex;align-items:center;gap:6px;margin:0 3px 4px}
.groupMessageMeta b{font-size:8px}
.groupMessageMeta time{font-size:7px;color:#9ba0a8}
.agentCallBadge{
  font-size:7px;color:#5b50c5;background:#efedff;border-radius:99px;padding:3px 5px
}
.messageBubble{
  background:rgba(255,255,255,.9);border:1px solid rgba(28,31,38,.075);
  border-radius:13px;padding:9px 11px;font-size:9px;line-height:1.6;
  box-shadow:var(--shadow-sm)
}
.groupMessage.me .messageBubble{
  background:linear-gradient(135deg,#7162fa,#5d4ee6);color:#fff;border-color:transparent
}
.mention{color:#5f53d1;font-weight:700}
.groupMessage.me .mention{color:#fff}
.reactions{display:flex;gap:5px;margin:5px 3px 0}
.reaction{
  border:1px solid rgba(28,31,38,.07);background:#fff;border-radius:99px;
  padding:3px 6px;font-size:7px;color:#757a83
}
.inlineReply{
  margin-top:6px;border-left:2px solid rgba(109,93,252,.18);padding-left:8px;
  font-size:8px;color:#6d727b;line-height:1.5
}
.inlineReply b{color:#444a52}

.workObjectCard{
  margin-top:8px;border:1px solid rgba(109,93,252,.14);background:#fbfaff;
  border-radius:11px;padding:9px;min-width:300px;max-width:100%
}
.workObjectHead{display:flex;align-items:center;gap:7px}
.workObjectIcon{
  width:27px;height:27px;border-radius:8px;background:#efedff;color:#5a4fc2;
  display:grid;place-items:center;font-size:7px;font-weight:800
}
.workObjectMain{flex:1;min-width:0}
.workObjectMain b{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.workObjectMain small{display:block;font-size:7px;color:#9398a1;margin-top:3px}
.workObjectStatus{font-size:7px;border-radius:99px;padding:3px 5px;background:#f0f1f4;color:#737982}
.workObjectStatus.green{background:#e9f7f0;color:#347e60}
.workObjectStatus.red{background:#fff0f0;color:#b65353}
.workObjectActions{display:flex;gap:5px;margin-top:8px}
.workObjectActions button{
  border:1px solid rgba(28,31,38,.09);background:#fff;border-radius:7px;
  padding:5px 7px;font-size:7px;color:#5f646d
}
.workObjectActions .primaryMini{background:#1e2024;color:#fff}

.messageActionBar{
  display:flex;gap:4px;margin-top:5px;opacity:0;transform:translateY(-2px);
  transition:.18s ease
}
.groupMessage:hover .messageActionBar{opacity:1;transform:none}
.messageActionBar button{
  border:0;background:transparent;color:#9297a0;font-size:7px;padding:3px 4px;border-radius:5px
}
.messageActionBar button:hover{background:#f0f1f4;color:#575d66}

.groupContextRibbon{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin-top:10px;padding-top:10px;border-top:1px solid rgba(28,31,38,.06)

.groupContextRibbon small{font-size:7px;color:#9ba0a7;margin-right:2px}
.groupContextRibbon span{
  font-size:7px;padding:4px 6px;border-radius:99px;background:#f3f3f5;color:#70757d
}

.groupComposerTag{
  display:inline-flex;align-items:center;gap:4px;background:#eef6ff;color:#476a9d;
  border-radius:99px;padding:3px 6px;font-size:7px;margin-left:4px
}

@media(max-width:800px){
